# Continuous Deployment pipeline with Canary strategy
# Experiment 3.2.2 – RENULASYA 24BAI70210
name: CD Pipeline – Canary Deploy

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:
    inputs:
      canary_percent:
        description: 'Canary traffic percent (0-100)'
        required: false
        default: '20'

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven
      - name: Run tests
        working-directory: backend
        run: mvn -B test

  docker-build:
    name: Build & Push Docker Image
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Uncomment and add secrets DOCKERHUB_USERNAME / DOCKERHUB_TOKEN to push
      # - name: Login to Docker Hub
      #   uses: docker/login-action@v3
      #   with:
      #     username: ${{ secrets.DOCKERHUB_USERNAME }}
      #     password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build Docker image
        run: |
          docker build -t renulasya/cd-canary-lab:${{ github.sha }} .
          docker tag renulasya/cd-canary-lab:${{ github.sha }} renulasya/cd-canary-lab:canary
          echo "Image built: renulasya/cd-canary-lab:canary"

      # - name: Push canary image
      #   run: |
      #     docker push renulasya/cd-canary-lab:${{ github.sha }}
      #     docker push renulasya/cd-canary-lab:canary

  canary-deploy:
    name: Canary Deploy (simulated)
    needs: docker-build
    runs-on: ubuntu-latest
    steps:
      - name: Deploy canary (20% traffic)
        run: |
          echo "=== CANARY DEPLOYMENT ==="
          echo "Image : renulasya/cd-canary-lab:canary"
          echo "Traffic split: 20% canary / 80% stable"
          echo "Monitor metrics for 15 minutes..."
          echo "If healthy → promote to 100%"
          echo "If errors   → rollback to stable"
          echo "Submitted by: RENULASYA 24BAI70210"

  promote:
    name: Promote Canary (manual)
    needs: canary-deploy
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Full rollout
        run: |
          echo "Promoting canary → stable (100% traffic)"
          echo "Tagging image as :latest / :stable"
