<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Cache API - Post Management</title>

    <style>

        * {
            box-sizing: border-box;
        }

        /* =========================
           LIGHT THEME
        ========================= */

        :root {
            --bg: #f5f6fa;
            --card: #ffffff;
            --text: #172033;
            --secondary: #687083;
            --border: #d8dce5;
            --primary: #4328a8;
            --primary-hover: #321c85;
            --green: #159447;
            --danger: #c62828;
            --input-bg: #ffffff;
        }

        /* =========================
           DARK THEME
        ========================= */

        body.dark {
            --bg: #12131a;
            --card: #1d1f2b;
            --text: #f1f3f8;
            --secondary: #aeb4c3;
            --border: #3a3d4c;
            --primary: #7055e8;
            --primary-hover: #826cf0;
            --green: #35c878;
            --danger: #ff6b6b;
            --input-bg: #272a38;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: var(--bg);
            color: var(--text);
            transition: background 0.3s, color 0.3s;
        }

        .container {
            max-width: 1200px;
            margin: auto;
            padding: 30px;
        }

        /* =========================
           HEADER
        ========================= */

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
        }

        .logo-section h1 {
            margin: 0;
            color: var(--primary);
            font-size: 32px;
        }

        .logo-section p {
            margin-top: 8px;
            color: var(--secondary);
            font-size: 16px;
        }

        .header-actions {
            display: flex;
            gap: 10px;
            align-items: center;
        }

        /* =========================
           BUTTONS
        ========================= */

        button {
            border: none;
            border-radius: 9px;
            padding: 11px 18px;
            cursor: pointer;
            font-size: 15px;
            transition: 0.2s;
        }

        .primary-btn {
            background: var(--primary);
            color: white;
        }

        .primary-btn:hover {
            background: var(--primary-hover);
        }

        .refresh-btn,
        .theme-btn {
            background: var(--card);
            color: var(--text);
            border: 1px solid var(--border);
        }

        .refresh-btn:hover,
        .theme-btn:hover {
            transform: translateY(-1px);
        }

        .theme-btn {
            width: 52px;
            padding: 11px;
            font-size: 18px;
        }

        .cancel-btn {
            background: #555e70;
            color: white;
        }

        .edit-btn {
            background: #e8e5ff;
            color: #4328a8;
        }

        .edit-btn:hover {
            background: #d9d4ff;
        }

        .delete-btn {
            background: #ffe5e5;
            color: #c62828;
        }

        .delete-btn:hover {
            background: #ffd0d0;
        }

        /* =========================
           STATISTICS
        ========================= */

        .stats {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 20px;
            margin-bottom: 20px;
        }

        .stat-card {
            background: var(--card);
            padding: 25px;
            border-radius: 15px;
            box-shadow: 0 3px 15px rgba(0,0,0,0.08);
        }

        .stat-icon {
            font-size: 27px;
            margin-bottom: 10px;
        }

        .stat-card h2 {
            margin: 5px 0;
            font-size: 30px;
        }

        .stat-card p {
            margin: 0;
            color: var(--secondary);
        }

        /* =========================
           CACHE STATUS
        ========================= */

        .cache-status {
            display: flex;
            align-items: center;
            gap: 10px;
            background: var(--card);
            padding: 15px 18px;
            border-radius: 10px;
            margin-bottom: 25px;
        }

        .green-dot {
            width: 11px;
            height: 11px;
            background: var(--green);
            border-radius: 50%;
        }

        /* =========================
           FORM
        ========================= */

        .form-card {
            background: var(--card);
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 3px 15px rgba(0,0,0,0.08);
            margin-bottom: 35px;
        }

        .form-card h2 {
            margin-top: 0;
        }

        input,
        textarea {
            width: 100%;
            padding: 14px;
            margin-top: 8px;
            margin-bottom: 18px;
            border: 1px solid var(--border);
            border-radius: 9px;
            font-size: 15px;
            outline: none;
            background: var(--input-bg);
            color: var(--text);
        }

        input::placeholder,
        textarea::placeholder {
            color: var(--secondary);
        }

        input:focus,
        textarea:focus {
            border-color: var(--primary);
        }

        textarea {
            min-height: 130px;
            resize: vertical;
        }

        .form-buttons {
            display: flex;
            gap: 10px;
        }

        /* =========================
           POSTS HEADER
        ========================= */

        .posts-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 18px;
        }

        .posts-header h2 {
            margin: 0;
        }

        .tools {
            display: flex;
            gap: 10px;
        }

        .search {
            width: 230px;
            margin: 0;
        }

        select {
            padding: 12px;
            border-radius: 8px;
            border: 1px solid var(--border);
            background: var(--card);
            color: var(--text);
            font-size: 14px;
        }

        /* =========================
           POSTS GRID
        ========================= */

        #posts {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 20px;
        }

        .post {
            background: var(--card);
            border-radius: 15px;
            padding: 25px;
            box-shadow: 0 3px 15px rgba(0,0,0,0.08);
            transition: 0.2s;
        }

        .post:hover {
            transform: translateY(-2px);
        }

        .post-number {
            display: inline-block;
            background: #e9e6ff;
            color: #4328a8;
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 13px;
            font-weight: bold;
            margin-bottom: 12px;
        }

        .post h3 {
            margin: 5px 0 12px;
            font-size: 21px;
        }

        .post p {
            color: var(--secondary);
            line-height: 1.6;
            min-height: 50px;
        }

        .post-footer {
            border-top: 1px solid var(--border);
            margin-top: 20px;
            padding-top: 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .active {
            color: var(--green);
            font-weight: bold;
        }

        .post-actions {
            display: flex;
            gap: 8px;
        }

        /* =========================
           EMPTY / LOADING
        ========================= */

        .empty {
            grid-column: 1 / -1;
            background: var(--card);
            text-align: center;
            padding: 60px 20px;
            border-radius: 15px;
        }

        .empty-icon {
            font-size: 50px;
        }

        .empty p {
            color: var(--secondary);
        }

        .loading {
            grid-column: 1 / -1;
            text-align: center;
            padding: 40px;
            font-size: 18px;
        }

        /* =========================
           MESSAGE
        ========================= */

        .message {
            position: fixed;
            right: 25px;
            top: 25px;
            padding: 15px 22px;
            border-radius: 9px;
            color: white;
            font-weight: bold;
            display: none;
            z-index: 1000;
        }

        .success {
            background: #159447;
        }

        .error {
            background: #c62828;
        }

        /* =========================
           RESPONSIVE
        ========================= */

        @media(max-width: 800px) {

            .stats {
                grid-template-columns: 1fr;
            }

            #posts {
                grid-template-columns: 1fr;
            }

            .posts-header {
                flex-direction: column;
                align-items: flex-start;
                gap: 15px;
            }

            .tools {
                width: 100%;
            }

            .search {
                width: 100%;
            }

            .header {
                flex-direction: column;
                align-items: flex-start;
                gap: 15px;
            }

        }

    </style>
</head>

<body>

<div class="container">

    <!-- HEADER -->

    <div class="header">

        <div class="logo-section">
            <h1>📚 Cache API</h1>
            <p>Post Management Dashboard</p>
        </div>

        <div class="header-actions">

            <button
                class="refresh-btn"
                onclick="loadPosts()">
                🔄 Refresh
            </button>

            <button
                class="theme-btn"
                id="themeButton"
                onclick="toggleTheme()">
                🌙
            </button>

        </div>

    </div>


    <!-- STATISTICS -->

    <div class="stats">

        <div class="stat-card">
            <div class="stat-icon">📄</div>

            <h2 id="totalPosts">0</h2>

            <p>Total Posts</p>
        </div>


        <div class="stat-card">
            <div class="stat-icon">⚡</div>

            <h2>Active</h2>

            <p>Cache Status</p>
        </div>


        <div class="stat-card">
            <div class="stat-icon">🚀</div>

            <h2>Fast</h2>

            <p>Optimized API</p>
        </div>

    </div>


    <!-- CACHE STATUS -->

    <div class="cache-status">

        <span class="green-dot"></span>

        <strong>Cache System Active</strong>

        <span>•</span>

        <span>Responses are optimized using caching</span>

    </div>


    <!-- CREATE / EDIT FORM -->

    <div class="form-card">

        <h2 id="formTitle">
            ✏️ Create New Post
        </h2>

        <input
            id="title"
            type="text"
            placeholder="Enter post title"
        >

        <textarea
            id="content"
            placeholder="Write your post content..."
        ></textarea>


        <div class="form-buttons">

            <button
                id="submitButton"
                class="primary-btn"
                onclick="createPost()">

                ➕ Create Post

            </button>


            <button
                id="cancelButton"
                class="cancel-btn"
                onclick="cancelEdit()"
                style="display:none;">

                Cancel

            </button>

        </div>

    </div>


    <!-- POSTS HEADER -->

    <div class="posts-header">

        <h2>📋 All Posts</h2>

        <div class="tools">

            <input
                class="search"
                id="search"
                type="text"
                placeholder="🔍 Search posts..."
                oninput="displayPosts()"
            >

            <select
                id="sort"
                onchange="displayPosts()">

                <option value="asc">
                    ID: Low → High
                </option>

                <option value="desc">
                    ID: High → Low
                </option>

            </select>

        </div>

    </div>


    <!-- POSTS -->

    <div id="posts"></div>

</div>


<!-- MESSAGE -->

<div id="message" class="message"></div>


<script>

let allPosts = [];
let editingId = null;


/* ============================
   THEME
============================ */

function toggleTheme() {

    document.body.classList.toggle("dark");

    const button =
        document.getElementById("themeButton");

    if (document.body.classList.contains("dark")) {

        button.innerText = "☀️";

        localStorage.setItem("theme", "dark");

    } else {

        button.innerText = "🌙";

        localStorage.setItem("theme", "light");

    }
}


/* LOAD SAVED THEME */

function loadTheme() {

    const savedTheme =
        localStorage.getItem("theme");

    if (savedTheme === "dark") {

        document.body.classList.add("dark");

        document.getElementById("themeButton")
            .innerText = "☀️";
    }
}


/* ============================
   MESSAGE
============================ */

function showMessage(text, type) {

    const message =
        document.getElementById("message");

    message.innerText = text;

    message.className =
        "message " + type;

    message.style.display = "block";

    setTimeout(() => {

        message.style.display = "none";

    }, 2500);
}


/* ============================
   CREATE POST
============================ */

async function createPost() {

    const title =
        document.getElementById("title")
            .value.trim();

    const content =
        document.getElementById("content")
            .value.trim();


    if (!title || !content) {

        showMessage(
            "Please enter title and content",
            "error"
        );

        return;
    }


    try {

        const response =
            await fetch("/api/posts", {

                method: "POST",

                headers: {
                    "Content-Type": "application/json"
                },

                body: JSON.stringify({
                    title: title,
                    content: content
                })

            });


        if (!response.ok) {
            throw new Error();
        }


        showMessage(
            "Post created successfully!",
            "success"
        );


        document.getElementById("title").value = "";

        document.getElementById("content").value = "";


        await loadPosts();

    }

    catch(error) {

        console.error(error);

        showMessage(
            "Failed to create post",
            "error"
        );
    }
}


/* ============================
   LOAD POSTS
============================ */

async function loadPosts() {

    const container =
        document.getElementById("posts");


    container.innerHTML =
        `<div class="loading">
            ⏳ Loading posts...
        </div>`;


    try {

        const response =
            await fetch("/api/posts");


        if (!response.ok) {
            throw new Error();
        }


        allPosts =
            await response.json();


        displayPosts();

    }

    catch(error) {

        console.error(error);

        container.innerHTML =
            `<div class="empty">

                <div class="empty-icon">
                    ⚠️
                </div>

                <h3>
                    Failed to load posts
                </h3>

                <p>
                    Please refresh and try again.
                </p>

            </div>`;
    }
}


/* ============================
   DISPLAY POSTS
============================ */

function displayPosts() {

    const container =
        document.getElementById("posts");


    const search =
        document.getElementById("search")
            .value
            .toLowerCase();


    const sort =
        document.getElementById("sort").value;


    let posts =
        allPosts.filter(post =>

            (post.title || "")
                .toLowerCase()
                .includes(search)

            ||

            (post.content || "")
                .toLowerCase()
                .includes(search)

        );


    posts.sort((a, b) => {

        return sort === "asc"
            ? a.id - b.id
            : b.id - a.id;

    });


    document.getElementById("totalPosts")
        .innerText = allPosts.length;


    if (posts.length === 0) {

        container.innerHTML =
            `<div class="empty">

                <div class="empty-icon">
                    📭
                </div>

                <h3>
                    No posts found
                </h3>

                <p>
                    Create a new post or change your search.
                </p>

            </div>`;

        return;
    }


    container.innerHTML = "";


    posts.forEach(post => {

        const postDiv =
            document.createElement("div");


        postDiv.className = "post";


        postDiv.innerHTML = `

            <span class="post-number">
                POST #${post.id}
            </span>

            <h3>
                ${escapeHtml(post.title)}
            </h3>

            <p>
                ${escapeHtml(post.content)}
            </p>

            <div class="post-footer">

                <span class="active">
                    ● Active
                </span>

                <div class="post-actions">

                    <button
                        class="edit-btn"
                        onclick="editPost(${post.id})">

                        ✏️ Edit

                    </button>


                    <button
                        class="delete-btn"
                        onclick="deletePost(${post.id})">

                        🗑️ Delete

                    </button>

                </div>

            </div>
        `;


        container.appendChild(postDiv);

    });
}


/* ============================
   EDIT POST
============================ */

function editPost(id) {

    const post =
        allPosts.find(p => p.id === id);


    if (!post) {

        showMessage(
            "Post not found",
            "error"
        );

        return;
    }


    editingId = id;


    document.getElementById("title").value =
        post.title;


    document.getElementById("content").value =
        post.content;


    document.getElementById("formTitle").innerText =
        "✏️ Edit Post";


    document.getElementById("submitButton").innerText =
        "💾 Update Post";


    document.getElementById("submitButton").onclick =
        updatePost;


    document.getElementById("cancelButton")
        .style.display = "inline-block";


    window.scrollTo({
        top: 0,
        behavior: "smooth"
    });
}


/* ============================
   UPDATE POST
============================ */

async function updatePost() {

    if (editingId === null) {
        return;
    }


    const title =
        document.getElementById("title")
            .value.trim();


    const content =
        document.getElementById("content")
            .value.trim();


    if (!title || !content) {

        showMessage(
            "Please enter title and content",
            "error"
        );

        return;
    }


    try {

        const response =
            await fetch(
                `/api/posts/${editingId}`,
                {
                    method: "PUT",

                    headers: {
                        "Content-Type": "application/json"
                    },

                    body: JSON.stringify({
                        title: title,
                        content: content
                    })
                }
            );


        if (!response.ok) {
            throw new Error();
        }


        showMessage(
            "Post updated successfully!",
            "success"
        );


        cancelEdit();

        await loadPosts();

    }

    catch(error) {

        console.error(error);

        showMessage(
            "Failed to update post",
            "error"
        );
    }
}


/* ============================
   CANCEL EDIT
============================ */

function cancelEdit() {

    editingId = null;


    document.getElementById("title").value = "";

    document.getElementById("content").value = "";


    document.getElementById("formTitle").innerText =
        "✏️ Create New Post";


    document.getElementById("submitButton").innerText =
        "➕ Create Post";


    document.getElementById("submitButton").onclick =
        createPost;


    document.getElementById("cancelButton")
        .style.display = "none";
}


/* ============================
   DELETE POST
============================ */

async function deletePost(id) {

    const confirmDelete =
        confirm(
            "Are you sure you want to delete this post?"
        );


    if (!confirmDelete) {
        return;
    }


    try {

        const response =
            await fetch(
                `/api/posts/${id}`,
                {
                    method: "DELETE"
                }
            );


        if (!response.ok) {
            throw new Error();
        }


        showMessage(
            "Post deleted successfully!",
            "success"
        );


        if (editingId === id) {
            cancelEdit();
        }


        await loadPosts();

    }

    catch(error) {

        console.error(error);

        showMessage(
            "Failed to delete post",
            "error"
        );
    }
}


/* ============================
   SECURITY
============================ */

function escapeHtml(text) {

    const div =
        document.createElement("div");

    div.innerText = text || "";

    return div.innerHTML;
}


/* ============================
   START APPLICATION
============================ */

loadTheme();

loadPosts();

</script>

</body>
</html>
