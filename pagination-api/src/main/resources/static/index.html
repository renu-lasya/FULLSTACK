<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>PostFlow | Pagination Dashboard</title>

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: "Segoe UI", Arial, sans-serif;
        }

        body {
            min-height: 100vh;
            background: #f4f7fb;
            color: #172033;
        }

        /* ================= HEADER ================= */

        .header {
            background: linear-gradient(135deg, #312e81, #4f46e5, #7c3aed);
            color: white;
            padding: 28px 7%;
            box-shadow: 0 8px 25px rgba(49, 46, 129, 0.25);
        }

        .header-content {
            max-width: 1200px;
            margin: auto;
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 14px;
        }

        .logo-icon {
            width: 48px;
            height: 48px;
            background: rgba(255,255,255,0.18);
            border-radius: 14px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 25px;
        }

        .logo h1 {
            font-size: 28px;
        }

        .header p {
            margin-top: 8px;
            margin-left: 62px;
            opacity: 0.85;
        }

        /* ================= CONTAINER ================= */

        .container {
            max-width: 1200px;
            margin: 35px auto;
            padding: 0 20px;
        }

        /* ================= STATS ================= */

        .stats {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 20px;
            margin-bottom: 28px;
        }

        .stat-card {
            background: white;
            padding: 22px;
            border-radius: 18px;
            box-shadow: 0 8px 25px rgba(15, 23, 42, 0.07);
            display: flex;
            align-items: center;
            gap: 16px;
        }

        .stat-icon {
            width: 52px;
            height: 52px;
            border-radius: 15px;
            background: #eef2ff;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 24px;
        }

        .stat-card h3 {
            font-size: 24px;
            color: #4f46e5;
        }

        .stat-card span {
            color: #64748b;
            font-size: 14px;
        }

        /* ================= CREATE ================= */

        .create-card {
            background: white;
            border-radius: 22px;
            padding: 28px;
            box-shadow: 0 10px 30px rgba(15, 23, 42, 0.08);
            margin-bottom: 32px;
        }

        .section-heading {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 22px;
        }

        .section-heading h2 {
            color: #312e81;
            font-size: 22px;
        }

        .form-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 16px;
        }

        .input-group {
            display: flex;
            flex-direction: column;
            gap: 7px;
        }

        .input-group label {
            font-size: 13px;
            font-weight: 600;
            color: #475569;
        }

        input,
        textarea,
        select {
            width: 100%;
            border: 1px solid #dbe1ea;
            background: #fafbfe;
            border-radius: 12px;
            padding: 13px 15px;
            font-size: 15px;
            outline: none;
            transition: 0.2s;
        }

        input:focus,
        textarea:focus,
        select:focus {
            border-color: #6366f1;
            background: white;
            box-shadow: 0 0 0 4px rgba(99,102,241,0.1);
        }

        textarea {
            min-height: 100px;
            resize: vertical;
        }

        .full {
            grid-column: 1 / -1;
        }

        .create-btn {
            margin-top: 18px;
            border: none;
            padding: 13px 24px;
            border-radius: 11px;
            background: linear-gradient(135deg, #4f46e5, #7c3aed);
            color: white;
            font-size: 15px;
            font-weight: 700;
            cursor: pointer;
            box-shadow: 0 6px 15px rgba(79,70,229,0.25);
            transition: 0.2s;
        }

        .create-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 9px 20px rgba(79,70,229,0.3);
        }

        /* ================= POSTS HEADER ================= */

        .posts-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 18px;
        }

        .posts-header h2 {
            font-size: 23px;
        }

        .controls {
            display: flex;
            gap: 10px;
        }

        .controls select {
            width: auto;
            min-width: 150px;
            cursor: pointer;
        }

        /* ================= POSTS ================= */

        .posts {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 20px;
        }

        .post-card {
            background: white;
            border-radius: 18px;
            padding: 23px;
            box-shadow: 0 8px 25px rgba(15,23,42,0.07);
            border: 1px solid #edf0f5;
            position: relative;
            transition: 0.25s;
        }

        .post-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 14px 32px rgba(15,23,42,0.11);
        }

        .post-top {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 13px;
        }

        .post-number {
            background: #eef2ff;
            color: #4f46e5;
            padding: 5px 10px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 700;
        }

        .status {
            color: #16a34a;
            font-size: 12px;
            font-weight: 700;
        }

        .post-card h3 {
            font-size: 20px;
            margin-bottom: 9px;
            color: #172033;
        }

        .post-content {
            color: #64748b;
            line-height: 1.6;
            min-height: 48px;
            margin-bottom: 18px;
        }

        .post-footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-top: 1px solid #edf0f5;
            padding-top: 15px;
        }

        .date {
            color: #4f46e5;
            background: #f1f3ff;
            padding: 7px 10px;
            border-radius: 8px;
            font-size: 12px;
        }

        .delete-btn {
            border: none;
            background: #fee2e2;
            color: #dc2626;
            padding: 8px 12px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
        }

        .delete-btn:hover {
            background: #fecaca;
        }

        /* ================= PAGINATION ================= */

        .pagination-area {
            background: white;
            margin-top: 25px;
            padding: 18px;
            border-radius: 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 7px 20px rgba(15,23,42,0.06);
        }

        .page-info {
            color: #64748b;
            font-size: 14px;
        }

        .pagination {
            display: flex;
            gap: 7px;
            align-items: center;
        }

        .page-btn {
            border: 1px solid #dbe1ea;
            background: white;
            color: #475569;
            min-width: 38px;
            height: 38px;
            border-radius: 9px;
            cursor: pointer;
            font-weight: 600;
        }

        .page-btn:hover {
            border-color: #6366f1;
            color: #4f46e5;
        }

        .page-btn.active {
            background: #4f46e5;
            color: white;
            border-color: #4f46e5;
        }

        .page-btn:disabled {
            opacity: 0.4;
            cursor: not-allowed;
        }

        /* ================= EMPTY ================= */

        .empty {
            grid-column: 1 / -1;
            background: white;
            border-radius: 18px;
            padding: 55px;
            text-align: center;
            color: #64748b;
        }

        .empty-icon {
            font-size: 45px;
            margin-bottom: 12px;
        }

        /* ================= TOAST ================= */

        .toast {
            position: fixed;
            right: 25px;
            bottom: 25px;
            background: #172033;
            color: white;
            padding: 14px 20px;
            border-radius: 10px;
            display: none;
            box-shadow: 0 8px 25px rgba(0,0,0,0.2);
        }

        /* ================= RESPONSIVE ================= */

        @media(max-width: 800px) {

            .stats {
                grid-template-columns: 1fr;
            }

            .posts {
                grid-template-columns: 1fr;
            }

            .form-grid {
                grid-template-columns: 1fr;
            }

            .full {
                grid-column: auto;
            }

            .posts-header {
                flex-direction: column;
                align-items: flex-start;
                gap: 15px;
            }

            .pagination-area {
                flex-direction: column;
                gap: 15px;
            }

            .header {
                padding: 25px;
            }

            .header p {
                margin-left: 0;
            }
        }

    </style>
</head>

<body>

<!-- ================= HEADER ================= -->

<header class="header">

    <div class="header-content">

        <div class="logo">

            <div class="logo-icon">
                📚
            </div>

            <div>
                <h1>PostFlow</h1>
            </div>

        </div>

        <p>Spring Boot • Pagination • Sorting Dashboard</p>

    </div>

</header>


<main class="container">

    <!-- ================= STATS ================= -->

    <section class="stats">

        <div class="stat-card">

            <div class="stat-icon">
                📊
            </div>

            <div>
                <h3 id="totalPosts">0</h3>
                <span>Total Posts</span>
            </div>

        </div>


        <div class="stat-card">

            <div class="stat-icon">
                📄
            </div>

            <div>
                <h3 id="currentPage">1</h3>
                <span>Current Page</span>
            </div>

        </div>


        <div class="stat-card">

            <div class="stat-icon">
                ⚡
            </div>

            <div>
                <h3 id="pageSize">5</h3>
                <span>Posts Per Page</span>
            </div>

        </div>

    </section>


    <!-- ================= CREATE POST ================= -->

    <section class="create-card">

        <div class="section-heading">

            <span style="font-size:25px;">✨</span>

            <h2>Create New Post</h2>

        </div>


        <div class="form-grid">

            <div class="input-group">

                <label>Post Title</label>

                <input
                    type="text"
                    id="title"
                    placeholder="Enter post title"
                >

            </div>


            <div class="input-group">

                <label>Scheduled Date</label>

                <input
                    type="date"
                    id="scheduledDate"
                >

            </div>


            <div class="input-group full">

                <label>Post Content</label>

                <textarea
                    id="content"
                    placeholder="Write something interesting..."
                ></textarea>

            </div>

        </div>


        <button class="create-btn" onclick="addPost()">
            ✨ Create Post
        </button>

    </section>


    <!-- ================= POSTS ================= -->

    <div class="posts-header">

        <h2>📚 All Posts</h2>


        <div class="controls">

            <select id="sortBy" onchange="loadPosts(0)">

                <option value="id">Sort by ID</option>

                <option value="title">Sort by Title</option>

                <option value="scheduledDate">
                    Sort by Date
                </option>

            </select>


            <select id="direction" onchange="loadPosts(0)">

                <option value="asc">
                    ↑ Ascending
                </option>

                <option value="desc">
                    ↓ Descending
                </option>

            </select>

        </div>

    </div>


    <div id="posts" class="posts">

        <div class="empty">

            <div class="empty-icon">⏳</div>

            <h3>Loading posts...</h3>

        </div>

    </div>


    <!-- ================= PAGINATION ================= -->

    <div class="pagination-area">

        <div class="page-info" id="pageInfo">
            Loading...
        </div>


        <div class="pagination">

            <button
                class="page-btn"
                id="previousBtn"
                onclick="previousPage()">
                ←
            </button>


            <div id="pageNumbers"></div>


            <button
                class="page-btn"
                id="nextBtn"
                onclick="nextPage()">
                →
            </button>

        </div>

    </div>

</main>


<div id="toast" class="toast"></div>


<script>

    const API = "/api/posts";

    let currentPage = 0;
    let totalPages = 0;
    const pageSize = 5;


    // ================= LOAD POSTS =================

    async function loadPosts(page = 0) {

        currentPage = page;

        const sortBy =
            document.getElementById("sortBy").value;

        const direction =
            document.getElementById("direction").value;


        try {

            const response = await fetch(
                `${API}?page=${page}&size=${pageSize}&sortBy=${sortBy}&direction=${direction}`
            );


            if (!response.ok) {
                throw new Error("Failed to load posts");
            }


            const data = await response.json();

            totalPages = data.totalPages;


            document.getElementById("totalPosts")
                .textContent = data.totalElements;

            document.getElementById("currentPage")
                .textContent = data.totalPages === 0
                    ? 0
                    : page + 1;

            document.getElementById("pageSize")
                .textContent = pageSize;


            displayPosts(data.content);

            updatePagination(data);

        }

        catch (error) {

            document.getElementById("posts").innerHTML = `

                <div class="empty">

                    <div class="empty-icon">⚠️</div>

                    <h3>Unable to load posts</h3>

                    <p>Make sure Spring Boot is running.</p>

                </div>

            `;

        }

    }


    // ================= DISPLAY POSTS =================

    function displayPosts(posts) {

        const container =
            document.getElementById("posts");


        if (posts.length === 0) {

            container.innerHTML = `

                <div class="empty">

                    <div class="empty-icon">📭</div>

                    <h3>No posts available</h3>

                    <p>Create your first post above.</p>

                </div>

            `;

            return;
        }


        container.innerHTML = posts.map(post => `

            <div class="post-card">

                <div class="post-top">

                    <span class="post-number">
                        POST #${post.id}
                    </span>

                    <span class="status">
                        ● Active
                    </span>

                </div>


                <h3>
                    ${escapeHtml(post.title)}
                </h3>


                <p class="post-content">
                    ${escapeHtml(post.content)}
                </p>


                <div class="post-footer">

                    <span class="date">
                        📅 ${post.scheduledDate}
                    </span>


                    <button
                        class="delete-btn"
                        onclick="deletePost(${post.id})">

                        🗑 Delete

                    </button>

                </div>

            </div>

        `).join("");

    }


    // ================= PAGINATION =================

    function updatePagination(data) {

        document.getElementById("pageInfo")
            .textContent =
            `Showing ${data.numberOfElements} of ${data.totalElements} posts`;


        const previousBtn =
            document.getElementById("previousBtn");

        const nextBtn =
            document.getElementById("nextBtn");


        previousBtn.disabled = data.first;

        nextBtn.disabled = data.last;


        const pageNumbers =
            document.getElementById("pageNumbers");


        pageNumbers.innerHTML = "";


        for (let i = 0; i < data.totalPages; i++) {

            const button =
                document.createElement("button");

            button.className = "page-btn";

            if (i === data.number) {
                button.classList.add("active");
            }

            button.textContent = i + 1;

            button.onclick = () => loadPosts(i);

            pageNumbers.appendChild(button);

        }

    }


    function previousPage() {

        if (currentPage > 0) {
            loadPosts(currentPage - 1);
        }

    }


    function nextPage() {

        if (currentPage < totalPages - 1) {
            loadPosts(currentPage + 1);
        }

    }


    // ================= CREATE POST =================

    async function addPost() {

        const title =
            document.getElementById("title").value.trim();

        const content =
            document.getElementById("content").value.trim();

        const scheduledDate =
            document.getElementById("scheduledDate").value;


        if (!title || !content || !scheduledDate) {

            showToast("Please fill all fields.");

            return;
        }


        try {

            const response = await fetch(API, {

                method: "POST",

                headers: {
                    "Content-Type": "application/json"
                },

                body: JSON.stringify({

                    title: title,

                    content: content,

                    scheduledDate: scheduledDate

                })

            });


            if (!response.ok) {

                showToast("Failed to create post.");

                return;

            }


            document.getElementById("title").value = "";

            document.getElementById("content").value = "";

            document.getElementById("scheduledDate").value = "";


            showToast("Post created successfully!");


            loadPosts(0);

        }

        catch (error) {

            showToast("Server error.");

        }

    }


    // ================= DELETE POST =================

    async function deletePost(id) {

        if (!confirm("Are you sure you want to delete this post?")) {
            return;
        }


        try {

            const response =
                await fetch(`${API}/${id}`, {

                    method: "DELETE"

                });


            if (response.ok) {

                showToast("Post deleted successfully!");

                loadPosts(currentPage);

            }

            else {

                showToast("Failed to delete post.");

            }

        }

        catch (error) {

            showToast("Server error.");

        }

    }


    // ================= TOAST =================

    function showToast(message) {

        const toast =
            document.getElementById("toast");

        toast.textContent = message;

        toast.style.display = "block";


        setTimeout(() => {

            toast.style.display = "none";

        }, 2500);

    }


    // ================= SECURITY =================

    function escapeHtml(text) {

        const div = document.createElement("div");

        div.textContent = text;

        return div.innerHTML;

    }


    // ================= START =================

    loadPosts(0);

</script>

</body>
</html>
